<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode Welcome</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 1rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }
        h1 { margin-top: 0; color: #38bdf8; }
        p { color: #94a3b8; line-height: 1.5; }
        .badge {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            margin-top: 1rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>OpenCode</h1>
        <p>Добро пожаловать! Ваш репозиторий успешно подключен, а сайт развернут на GitHub Pages.</p>
        <a class="badge" href="https://github.com/Zublefar/OpenCode">Репозиторий на GitHub</a>
    </div>
</body>
</html>
