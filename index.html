<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трансляция камеры — OpenCode</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            padding: 1.5rem;
            text-align: center;
        }
        h1 {
            margin: 0;
            color: #38bdf8;
            font-size: 1.8rem;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 1rem 2rem 1rem;
            box-sizing: border-box;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #1e293b;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        footer {
            margin-top: auto;
            padding: 1rem;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Прямая трансляция камеры</h1>
    </header>
    <div class="container">
        <div class="video-wrapper">
            <iframe src="https://moidom.citylink.pro/pub/91555?view=list" allowfullscreen></iframe>
        </div>
    </div>
    <footer>
        OpenCode &copy; 2026
    </footer>
</body>
</html>
